<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="55%" stop-color="#0e1420"/>
      <stop offset="100%" stop-color="#0a0d16"/>
    </linearGradient>

    <radialGradient id="glowVite" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowVue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#42b883" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#42b883" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowNuxt" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00dc82" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#00dc82" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="softSmall" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <pattern id="dots" width="42" height="42" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" fill-opacity="0.055"/>
    </pattern>

    <linearGradient id="lineFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="1920" height="1080" fill="url(#base)"/>
  <rect width="1920" height="1080" fill="url(#dots)"/>

  <!-- large soft brand-color glows, off to the sides so center stays clear for title text -->
  <circle cx="220" cy="880" r="480" fill="url(#glowVite)" filter="url(#soft)"/>
  <circle cx="1700" cy="180" r="560" fill="url(#glowVue)" filter="url(#soft)"/>
  <circle cx="1780" cy="920" r="420" fill="url(#glowNuxt)" filter="url(#soft)"/>
  <circle cx="120" cy="140" r="320" fill="url(#glowVue)" filter="url(#soft)" opacity="0.5"/>

  <!-- faint horizon line -->
  <line x1="0" y1="760" x2="1920" y2="760" stroke="url(#lineFade)" stroke-width="1"/>

  <!-- abstract circuit / network paths -->
  <g stroke-width="1.4" fill="none" opacity="0.35">
    <path d="M -40 900 L 260 900 L 340 820 L 620 820" stroke="#a855f7"/>
    <path d="M 1920 260 L 1600 260 L 1520 340 L 1180 340" stroke="#42b883"/>
    <path d="M 1920 760 L 1660 760 L 1580 840 L 1340 840 L 1260 920" stroke="#00dc82"/>
    <path d="M -40 260 L 180 260 L 260 180" stroke="#42b883"/>
  </g>
  <g fill="#ffffff" opacity="0.5">
    <circle cx="260" cy="900" r="4"/>
    <circle cx="340" cy="820" r="4"/>
    <circle cx="1600" cy="260" r="4"/>
    <circle cx="1180" cy="340" r="4"/>
    <circle cx="1580" cy="840" r="4"/>
    <circle cx="1260" cy="920" r="4"/>
  </g>

  <!-- three brand chevrons, abstracted (not literal logos), bottom-right cluster -->
  <g transform="translate(1660,860)" opacity="0.9">
    <path d="M -70 60 L 0 -60 L 70 60 Z" fill="none" stroke="#42b883" stroke-width="6" stroke-linejoin="round" filter="url(#softSmall)" opacity="0.35"/>
    <path d="M -70 60 L 0 -60 L 70 60 Z" fill="none" stroke="#42b883" stroke-width="3" stroke-linejoin="round"/>
    <path d="M -46 60 L 0 -18 L 46 60 Z" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" opacity="0.6"/>
  </g>
  <g transform="translate(1780,760) scale(0.6)" opacity="0.85">
    <path d="M -10 -70 L 50 -10 L -10 30 L -55 -5 Z" fill="#a855f7" opacity="0.9"/>
    <path d="M -10 -70 L 50 -10 L -10 -30 L -35 -45 Z" fill="#c084fc"/>
  </g>

  <!-- vignette to keep edges calm and center readable -->
  <rect width="1920" height="1080" fill="black" opacity="0.12"/>
</svg>